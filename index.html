<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142c29"><title>StrongBase</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172923;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#142c29;color:white;padding:18px 16px}header div,main,nav{max-width:650px;margin:auto}header strong{font-size:22px}header small{display:block;color:#b7d5c9;margin-top:3px}nav{display:flex;gap:6px;padding:12px 10px;overflow:auto}button{cursor:pointer;font:inherit}nav button,.btn{border:0;border-radius:10px;padding:10px 13px;background:#e0e9e4;color:#15372d;font-weight:650}nav button.active,.primary{background:#246c54;color:white}main{padding:0 14px 50px}section{background:white;border:1px solid #e0e8e3;border-radius:14px;padding:16px;margin-bottom:12px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:14px 0 8px}p,.muted{color:#60766b;font-size:14px;line-height:1.5}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,textarea,select{width:100%;border:1px solid #cbd8d1;border-radius:9px;padding:11px;font:inherit;background:white;color:#172923}textarea{min-height:145px}input[type=number]{min-width:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.stack{display:grid;gap:9px}.exercise{border-top:1px solid #e4eae6;padding-top:12px;margin-top:12px}.setrow{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin:7px 0}.setrow input{padding:9px 4px;text-align:center}.small{font-size:12px;color:#60766b}.hidden{display:none}.pill{display:inline-block;border-radius:99px;background:#e8f4ed;padding:4px 9px;color:#246c54;font-size:12px}pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f5;padding:12px;border-radius:10px;font-size:12px}button:disabled{opacity:.5} .danger{color:#9b2f2f}.note{background:#f0f6f2;border-radius:9px;padding:10px;font-size:13px}
</style></head><body><header><div><strong>StrongBase</strong><small>Build your base. Track your progress.</small></div></header><nav id="nav"></nav><main id="app"></main><script>
const KEY='strongbase_v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"workouts":[],"sessions":[],"settings":{}}');let tab='Today',selected=0,editing=null;
const tabs=['Today','Import','History','Export','Sync'];const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));if(state.settings.url&&state.settings.key&&state.settings.token)cloudSave().catch(e=>console.warn('Sync failed:',e))};const uid=()=>crypto.randomUUID();const today=()=>new Date().toLocaleDateString('en-CA');const btn=(name,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${name}</button>`;
function render(){ $('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');$('app').innerHTML=({Today:todayView,Import:importView,History:historyView,Export:exportView,Sync:syncView}[tab])()}
function todayView(){if(!state.workouts.length)return `<section><h2>Welcome to StrongBase</h2><p>Import your first workout from ChatGPT to begin. Your data is saved on this device until cloud sync is configured.</p>${btn('Import workout',"tab='Import';render()",'primary')}</section>`;let w=state.workouts[Math.min(selected,state.workouts.length-1)];return `<section><h2>Start a workout</h2><label>Choose workout</label><select onchange="selected=Number(this.value);render()">${state.workouts.map((x,i)=>`<option value="${i}" ${i===selected?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}</select><p>${w.exercises.length} exercises · Log your actual sets below.</p><label>Date</label><input id="sessiondate" type="date" value="${today()}"></section><section><h2>${escapeHTML(w.name)}</h2>${w.exercises.map((e,i)=>exerciseView(e,i)).join('')}<label>Session notes</label><textarea id="notes" placeholder="How did the session feel?" style="min-height:75px"></textarea><p class="small">RPE: 7 = about 3 reps left; 8 = about 2 reps left; 9 = about 1 rep left.</p>${btn('Save completed session','saveSession()','primary')}</section>`}
function exerciseView(e,i){const prev=[...state.sessions].reverse().flatMap(s=>s.exercises).find(x=>x.original===e.name);return `<div class="exercise"><h3>${i+1}. ${escapeHTML(e.name)}</h3><div class="small">${escapeHTML(e.target||'')} ${prev?' · Last: '+escapeHTML(prev.sets.map(s=>s.kg+'kg × '+s.reps).join(', ')):''}</div><label>Exercise performed (change for substitution)</label><input id="ex${i}" value="${escapeHTML(e.name)}"><div class="setrow small"><span>Set</span><span>kg</span><span>reps</span><span>RPE</span></div>${Array.from({length:e.sets||3},(_,j)=>`<div class="setrow"><span>${j+1}</span><input aria-label="Set ${j+1} weight" id="kg${i}_${j}" type="number" step="0.5" min="0" placeholder="kg"><input aria-label="Set ${j+1} reps" id="reps${i}_${j}" type="number" min="0" placeholder="reps"><input aria-label="Set ${j+1} RPE" id="rpe${i}_${j}" type="number" min="1" max="10" step="0.5" placeholder="RPE"></div>`).join('')}</div>`}
function saveSession(){let w=state.workouts[selected],date=$('sessiondate').value;if(!date)return alert('Choose a date');let exercises=w.exercises.map((e,i)=>({original:e.name,performed:$('ex'+i).value.trim()||e.name,sets:Array.from({length:e.sets||3},(_,j)=>({kg:$('kg'+i+'_'+j).value,reps:$('reps'+i+'_'+j).value,rpe:$('rpe'+i+'_'+j).value})).filter(s=>s.kg!==''||s.reps!==''||s.rpe!=='')})).filter(e=>e.sets.length);if(!exercises.length)return alert('Log at least one set');state.sessions.push({id:uid(),date,workout:w.name,exercises,notes:$('notes').value});save();alert('Workout saved');tab='History';render()}
function importView(){return `<section><h2>Import from ChatGPT</h2><p>Paste a workout as JSON. Ask ChatGPT: “Format my StrongBase workout using the import schema.”</p><div class="note">Expected format: a name and an exercises array, each with name, sets, and target.</div><pre>{"name":"Workout C","exercises":[{"name":"Smith-machine RDL","sets":3,"target":"8–10 reps, RPE 7"},{"name":"Hip abduction machine","sets":3,"target":"12–15 reps"}]}</pre><textarea id="paste" placeholder="Paste workout JSON here"></textarea><div style="height:10px"></div>${btn('Import workout','importWorkout()','primary')} ${btn('Load sample','sample()')}</section><section><h2>Saved workouts</h2>${state.workouts.length?state.workouts.map((w,i)=>`<div class="row"><span>${escapeHTML(w.name)} (${w.exercises.length} exercises)</span><button class="btn danger" onclick="removeWorkout(${i})">Delete</button></div>`).join(''):'<p>No workouts imported yet.</p>'}</section>`}
function importWorkout(){try{let x=JSON.parse($('paste').value);let arr=Array.isArray(x)?x:[x];for(const w of arr){if(!w.name||!Array.isArray(w.exercises)||!w.exercises.length)throw Error('Each workout needs a name and exercises');w.exercises=w.exercises.map(e=>{if(!e.name)throw Error('Exercise missing name');return {name:String(e.name),sets:Math.max(1,Math.min(12,Number(e.sets)||3)),target:String(e.target||'')}});state.workouts.push({name:String(w.name),exercises:w.exercises})}save();alert('Workout imported');tab='Today';selected=state.workouts.length-1;render()}catch(e){alert('Import error: '+e.message)}}
function sample(){$('paste').value=JSON.stringify({name:'Workout C — sample',exercises:[{name:'Squat',sets:3,target:'8 reps · RPE 7'},{name:'Smith-machine RDL',sets:3,target:'10 reps · RPE 7'},{name:'Machine hip abduction',sets:3,target:'12–15 reps'},{name:'Chest-supported dumbbell row',sets:3,target:'10 reps'},{name:'Pallof press',sets:3,target:'12 per side'}]},null,2)}
function removeWorkout(i){if(confirm('Delete this workout template? Logged history will stay.')){state.workouts.splice(i,1);selected=0;save();render()}}
function historyView(){return `<section><h2>Training history</h2>${state.sessions.length?[...state.sessions].reverse().map(s=>`<div class="exercise"><div class="row"><strong>${escapeHTML(s.workout)}</strong><span class="small">${escapeHTML(s.date)}</span></div>${s.exercises.map(e=>`<p><b>${escapeHTML(e.performed)}</b>${e.original!==e.performed?' (substituted for '+escapeHTML(e.original)+')':''}<br>${e.sets.map(x=>`${escapeHTML(x.kg||'—')} kg × ${escapeHTML(x.reps||'—')} @ RPE ${escapeHTML(x.rpe||'—')}`).join(' · ')}</p>`).join('')}${s.notes?`<p>Notes: ${escapeHTML(s.notes)}</p>`:''}<button class="btn danger" onclick="deleteSession('${s.id}')">Delete session</button></div>`).join(''):'<p>Sessions you save will appear here.</p>'}</section>`}
function deleteSession(id){if(confirm('Delete this session?')){state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}}
function summary(){let cutoff=new Date();cutoff.setDate(cutoff.getDate()-7);let sessions=state.sessions.filter(s=>new Date(s.date+'T23:59:59')>=cutoff).sort((a,b)=>a.date.localeCompare(b.date));return `StrongBase — last 7 days\n${sessions.length} sessions\n\n`+(sessions.length?sessions.map(s=>`${s.date} — ${s.workout}\n${s.exercises.map(e=>`- ${e.performed}${e.original!==e.performed?' (instead of '+e.original+')':''}: ${e.sets.map(x=>`${x.kg||'—'}kg × ${x.reps||'—'} reps @ RPE ${x.rpe||'—'}`).join('; ')}`).join('\n')}${s.notes?'\nNotes: '+s.notes:''}`).join('\n\n'):'No sessions logged.')+'\n\nPlease suggest next week’s progression while keeping increases gradual.'}
function exportView(){return `<section><h2>Weekly ChatGPT export</h2><p>Copy this summary and paste it into our StrongBase project chat.</p><textarea id="summary" readonly style="min-height:260px">${escapeHTML(summary())}</textarea>${btn('Copy weekly summary','copySummary()','primary')}</section><section><h2>Backup</h2><p>Download your complete training data as a JSON backup. You can restore it on another device.</p>${btn('Download backup','downloadBackup()')} <label>Restore backup</label><input type="file" accept="application/json" onchange="restoreBackup(this)"></section>`}
async function copySummary(){try{await navigator.clipboard.writeText(summary());alert('Copied!')}catch(e){$('summary').select();alert('Select and copy the summary manually.')}}
function downloadBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='strongbase-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function restoreBackup(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.workouts)||!Array.isArray(x.sessions))throw Error('Invalid backup');if(confirm('Replace all current workouts and history with this backup?')){state={...x,settings:state.settings};save();render()}}catch(e){alert(e.message)}}
function syncView(){return `<section><h2>Cloud sync (optional)</h2><p>Connect your own Supabase project to sync data between phone and laptop. Until connected, data is stored only in this browser. Use backups to protect it.</p><label>Supabase project URL</label><input id="url" placeholder="https://yourproject.supabase.co" value="${escapeHTML(state.settings.url||'')}"><label>Supabase publishable / anon key</label><input id="key" type="password" value="${escapeHTML(state.settings.key||'')}"><label>Account email</label><input id="email" type="email" value="${escapeHTML(state.settings.email||'')}"><label>Password</label><input id="password" type="password" placeholder="Your Supabase account password"><div style="height:12px"></div>${btn('Save settings','saveSettings()')} ${btn('Sign up','auth("signup")')} ${btn('Sign in','auth("signin")','primary')}<div style="height:10px"></div>${btn('Upload to cloud','cloudUpload()')} ${btn('Download from cloud','cloudDownload()')} ${btn('Sign out','signOut()')}<p class="small">${state.settings.token?'Signed in. Changes upload automatically; use Download from cloud on other devices to refresh.':'Not signed in.'} Never paste a Supabase service_role/secret key here.</p></section>`}
function saveSettings(){state.settings={...state.settings,url:$('url').value.trim().replace(/\/$/,''),key:$('key').value.trim(),email:$('email').value.trim()};save();alert('Settings saved')}
async function api(path,opts={}){let s=state.settings;let res=await fetch(s.url+'/rest/v1/'+path,{...opts,headers:{apikey:s.key,Authorization:'Bearer '+s.token,'Content-Type':'application/json',...(opts.headers||{})}});if(!res.ok)throw Error(await res.text());return res.status===204?null:res.json()}
async function auth(mode){try{saveSettings();let s=state.settings;let res=await fetch(s.url+'/auth/v1/'+(mode==='signup'?'signup':'token?grant_type=password'),{method:'POST',headers:{apikey:s.key,'Content-Type':'application/json'},body:JSON.stringify({email:s.email,password:$('password').value})});let x=await res.json();if(!res.ok)throw Error(x.msg||x.error_description||x.message||'Authentication failed');if(x.access_token){s.token=x.access_token;s.refresh=x.refresh_token;s.user=x.user.id;save();alert('Signed in');render()}else alert('Check your email to confirm your account, then sign in.')}catch(e){alert(e.message)}}
async function cloudSave(){let s=state.settings;if(!s.user)return;let payload={workouts:state.workouts,sessions:state.sessions};await api('user_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:s.user,payload})})}
async function cloudUpload(){try{await cloudSave();alert('Uploaded')}catch(e){alert('Upload failed: '+e.message)}}
async function cloudDownload(){try{let x=await api('user_data?select=payload&user_id=eq.'+encodeURIComponent(state.settings.user));if(!x.length)return alert('No cloud data yet');if(confirm('Replace local workouts and history with cloud data?')){state.workouts=x[0].payload.workouts||[];state.sessions=x[0].payload.sessions||[];localStorage.setItem(KEY,JSON.stringify(state));alert('Downloaded');render()}}catch(e){alert('Download failed: '+e.message)}}
function signOut(){delete state.settings.token;delete state.settings.refresh;delete state.settings.user;localStorage.setItem(KEY,JSON.stringify(state));render()}
render();
</script></body></html>
